<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR CODE | الأمير نت</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap"><section class="panel" style="text-align:center"><div class="ico green">▦</div><h1 class="net-title" style="font-size:28px">QR CODE</h1><p style="font-size:11px;color:#aeb8c4">امسح الرمز للاتصال بالشبكة</p><div style="background:#fff;border-radius:22px;padding:15px;margin-top:15px;box-shadow:0 16px 30px rgba(0,0,0,.25)"><img src="images/qrcode.png" alt="QR CODE" style="display:block;width:100%;max-width:300px;margin:auto;border-radius:12px" onerror="this.parentElement.innerHTML='<div style=\'padding:50px 10px;color:#667\'>ضع رمز QR في images/qrcode.png</div>'"></div><a class="login-btn" href="$(link-login-only)" style="text-decoration:none">العودة</a></section></main></body></html>
